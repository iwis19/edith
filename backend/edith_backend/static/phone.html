<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>EDITH location</title>
<style>
  /* Quiet by design: near-black text, one grey for everything secondary, and the one accent on the main action. The
     soft blue wash behind the frosted card is the only other colour. */
  :root {
    color-scheme: light;
    --text: #111318;
    --secondary: #6b7280;
    --hairline: rgba(17, 19, 24, .08);
    --accent: #1f4dff;
    --accent-pressed: #1a3fd6;
    --glass: rgba(255, 255, 255, .62);
    --danger: #c42b3f;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; padding: 48px 20px 40px; color: var(--text);
    background:
      radial-gradient(120% 60% at 50% 0%, #dcebff 0%, rgba(220, 235, 255, 0) 70%),
      linear-gradient(180deg, #f4f8ff 0%, #fbfcfe 100%);
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 420px; margin: 0 auto; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--secondary); }
  h1 { margin: 6px 0 6px; font-size: 30px; line-height: 1.15; font-weight: 650; letter-spacing: -.025em; }
  p { margin: 0; color: var(--secondary); }
  .lead { margin-bottom: 28px; }
  button {
    width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1; letter-spacing: -.01em; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:active { background: var(--accent-pressed); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Disabled is how the page shows it is sharing: quiet, not greyed out. */
  button[disabled] { background: var(--glass); color: var(--text); box-shadow: inset 0 0 0 1px var(--hairline); cursor: default; }
  .card {
    margin-top: 16px; padding: 4px 20px; border-radius: 20px;
    background: var(--glass); border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 1px 1px rgba(17, 19, 24, .03), 0 12px 32px rgba(31, 77, 255, .06);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  }
  .row { padding: 14px 0; border-top: 1px solid var(--hairline); }
  .row:first-child { border-top: 0; }
  .label { font-size: 13px; color: var(--secondary); }
  .place { margin-top: 2px; font-size: 20px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; word-break: break-word; }
  #sent { margin-top: 2px; }
  .error { padding: 14px 20px; color: var(--danger); font-size: 15px; }
  .hidden { display: none; }
  #code {
    display: block; width: 100%; height: 76px; margin: 0 0 12px; border: 1px solid var(--hairline); border-radius: 16px;
    background: var(--glass); color: var(--text); text-align: center;
    font-family: inherit; font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .5em; text-indent: .5em;
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    transition: border-color .15s, box-shadow .15s;
  }
  #code::placeholder { color: rgba(17, 19, 24, .18); }
  #code:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(31, 77, 255, .12); }
  #hint { margin-top: 20px; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
<div class="brand">EDITH</div>
<form id="pair" autocomplete="off">
  <h1>Connect your phone</h1>
  <p class="lead" id="codeLabel">Enter the code shown in your headset.</p>
  <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="4" aria-label="4-digit code from the headset" placeholder="0000">
  <button id="connect" type="submit">Connect</button>
</form>
<div id="shared" class="hidden">
  <h1>Location</h1>
  <p class="lead">EDITH uses it to name what you see.</p>
</div>
<button id="share" type="button" class="hidden">Share location</button>
<div id="error" class="card error hidden" role="alert"></div>
<div id="status" class="card hidden">
  <div class="row">
    <div class="label">You're at</div>
    <div id="place" class="place">Not shared yet</div>
  </div>
  <div class="row">
    <div class="label">Last sent</div>
    <div id="sent">Never</div>
  </div>
  <div class="row">
    <div class="label">Compass</div>
    <div id="compass">Off</div>
  </div>
</div>
<p id="hint" class="hidden">Keep this page open with the screen on. For directions, hold the phone flat and pointing the way you face.</p>
</main>
<script>
(function () {
  "use strict";
  // While the headset is giving directions, the position and compass go every two seconds so the arrow keeps up.
  var SEND_EVERY_MS = 10000, NAV_SEND_EVERY_MS = 2000, SEND_AFTER_METRES = 25, HEADING_FRESH_MS = 3000;
  var navigating = false, heading = null, headingAccuracy = null, headingAt = 0, compassOn = false;
  var $ = function (id) { return document.getElementById(id); };
  var TOKEN_KEY = "edith.phone";
  var token = null, watchId = null, wakeLock = null;
  var last = { lat: null, lon: null, at: 0 }, latest = null, sending = false, pairing = false;

  function load() {
    try {
      token = localStorage.getItem(TOKEN_KEY);
    } catch (e) {}
    showScreen();
  }

  function saveToken(value) {
    token = value;
    try {
      if (value) localStorage.setItem(TOKEN_KEY, value); else localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
  }

  function showScreen() {
    var paired = !!token;
    $("codeLabel").textContent = paired ? "Enter a new code" : "Enter the code shown in your headset.";
    $("share").classList.toggle("hidden", !paired);
    $("status").classList.toggle("hidden", !paired);
    $("shared").classList.toggle("hidden", !paired);
    $("hint").classList.toggle("hidden", !paired);
    if (!paired) $("code").focus();
  }

  function claim() {
    var code = $("code").value.replace(/\D/g, "");
    if (pairing) return;
    if (code.length !== 4) { showError("Type the 4 digits shown in the headset."); return; }
    pairing = true;
    $("connect").disabled = true;
    fetch("/pair/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    }).then(function (res) {
      if (res.status === 404) throw new Error("That code did not work. Look at the headset for the current code.");
      if (res.status === 429) throw new Error("Too many wrong codes. Wait ten minutes, then try again.");
      if (!res.ok) throw new Error("The backend refused the code (" + res.status + ").");
      return res.json();
    }).then(function (reply) {
      saveToken(reply.phone_token);
      $("code").value = "";
      showError("");
      showScreen();
    }).catch(function (err) {
      showError(err instanceof TypeError ? "Cannot reach the backend. Check the phone's connection." : err.message);
      $("code").value = "";
      $("code").focus();
    }).finally(function () { pairing = false; $("connect").disabled = false; });
  }

  function showError(text) {
    var box = $("error");
    box.textContent = text;
    box.classList.toggle("hidden", !text);
  }

  function metres(lat1, lon1, lat2, lon2) {
    var r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 12742000 * Math.asin(Math.sqrt(a));
  }

  function render(summary) {
    $("place").textContent = summary.place || (summary.resolving ? "Finding where you are..." : "Place not found yet");
  }

  function send(position) {
    if (sending || !token) return;
    sending = true;
    var c = position.coords;
    var body = {
      lat: c.latitude, lon: c.longitude,
      accuracy_m: Math.min(Math.max(c.accuracy || 0, 0), 5000),
      taken_at: new Date(position.timestamp).toISOString()
    };
    if (heading !== null && Date.now() - headingAt <= HEADING_FRESH_MS) {
      body.heading_deg = heading;
      if (headingAccuracy !== null) body.heading_accuracy_deg = headingAccuracy;
    }
    // Browsers give a course only while moving; at walking pace and above it is steadier than the compass.
    if (typeof c.heading === "number" && !isNaN(c.heading) && typeof c.speed === "number" && c.speed >= 0.5) {
      body.course_deg = ((c.heading % 360) + 360) % 360;
      body.speed_mps = Math.min(c.speed, 100);
    }
    fetch("/location", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Edith-Phone": token },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (res.status === 401) { unpair(); throw new Error("This phone needs a new code. Look in your headset."); }
      if (!res.ok) throw new Error("The backend refused the position (" + res.status + ").");
      return res.json();
    }).then(function (summary) {
      last = { lat: body.lat, lon: body.lon, at: Date.now() };
      $("sent").textContent = new Date().toLocaleTimeString() + ", accurate to " + Math.round(c.accuracy) + " m";
      showError("");
      navigating = !!summary.navigating;
      render(summary);
    }).catch(function (err) {
      showError(err instanceof TypeError ? "Cannot reach the backend. Check the phone's connection." : err.message);
    }).finally(function () { sending = false; });
  }

  function onPosition(position) {
    latest = position;
    var now = Date.now();
    var moved = last.lat === null ? Infinity :
      metres(last.lat, last.lon, position.coords.latitude, position.coords.longitude);
    if (now - last.at >= sendEvery() || moved >= SEND_AFTER_METRES) send(position);
  }

  function sendEvery() { return navigating ? NAV_SEND_EVERY_MS : SEND_EVERY_MS; }

  // Degrees clockwise from north that the top of the phone points, corrected for a rotated screen.
  function onOrientation(e) {
    var h = null;
    if (typeof e.webkitCompassHeading === "number") {
      h = e.webkitCompassHeading;
      headingAccuracy = typeof e.webkitCompassAccuracy === "number" && e.webkitCompassAccuracy >= 0 ? e.webkitCompassAccuracy : null;
    } else if (e.absolute && typeof e.alpha === "number") {
      h = 360 - e.alpha;
      headingAccuracy = null;
    }
    if (h === null) return;
    var turn = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
    heading = Math.round((((h + turn) % 360) + 360) % 360 * 10) / 10;
    headingAt = Date.now();
    if (!compassOn) { compassOn = true; $("compass").textContent = "On"; }
  }

  function listenCompass() {
    if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", onOrientation);
    else window.addEventListener("deviceorientation", onOrientation);
    setTimeout(function () { if (!compassOn) $("compass").textContent = "Not available on this phone"; }, 4000);
  }

  // iOS asks for motion access, and only inside the tap itself, before anything else waits.
  function startCompass() {
    var D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === "function") {
      D.requestPermission().then(function (answer) {
        if (answer === "granted") listenCompass(); else $("compass").textContent = "Motion access was denied";
      }).catch(function () { $("compass").textContent = "Motion access was denied"; });
    } else if (D) {
      listenCompass();
    } else {
      $("compass").textContent = "Not available on this phone";
    }
  }

  function onGeoError(err) {
    if (err.code === 1) showError("Location permission was denied. Allow location for this site in the phone's settings, then tap Share location.");
    else if (err.code === 2) showError("The phone could not find its position. Go outside or check that location is on.");
    else showError("Finding the position took too long. It will keep trying.");
    if (err.code === 1) stop();
  }

  function holdWake() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (lock) { wakeLock = lock; }).catch(function () {});
  }

  function stop() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    $("share").disabled = false;
    $("share").textContent = "Share location";
  }

  function unpair() {
    stop();
    saveToken(null);
    showScreen();
  }

  function start() {
    if (!token) { showScreen(); return; }
    if (!navigator.geolocation) { showError("This browser has no location support."); return; }
    if (!compassOn) startCompass();
    showError("");
    $("share").disabled = true;
    $("share").textContent = "Sharing location";
    holdWake();
    watchId = navigator.geolocation.watchPosition(onPosition, onGeoError,
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  }

  // A tick re-sends the newest position when the phone is standing still and watchPosition stays quiet.
  setInterval(function () {
    if (watchId !== null && latest && Date.now() - last.at >= sendEvery()) send(latest);
  }, 1000);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && watchId !== null) holdWake();
  });

  $("share").addEventListener("click", start);
  $("pair").addEventListener("submit", function (e) { e.preventDefault(); claim(); });
  $("code").addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 4);
    if (this.value.length === 4) claim();
  });
  load();
})();
</script>
</body>
</html>
